aid: the-portal
name: Portals
description: 'Portals (theportal.to) is a browser-based, Web3 metaverse and social gaming platform where
  users can play, collect, and create in a connected universe of interoperable virtual worlds. Players
  embark on quests, collect rare loot and digital collectibles, and build their own spaces, all directly
  in the browser without a download. Built on the Solana blockchain, Portals is a consumer-facing metaverse
  experience backed by Multicoin Capital. This profile was added to the API Evangelist network as a
  portfolio-company lead; as of this enrichment pass Portals publishes no public developer API, SDK, or
  documentation surface, so this remains a company/identity profile rather than an API provider.'
